
name: Build CMSCrystalLogger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -O2 \
            -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework Vision \
            -install_name @rpath/CMSCrystalLogger.dylib \
            CMSCrystalLogger.m \
            -o CMSCrystalLogger.dylib

      - name: Verify
        run: |
          file CMSCrystalLogger.dylib
          ls -lh CMSCrystalLogger.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: CMSCrystalLogger-v10
          path: CMSCrystalLogger.dylib
