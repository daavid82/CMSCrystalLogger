
name: Build CMSCrystalLogger

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Download Dobby
        run: |
          git clone --recursive --depth 1 https://github.com/jmpews/Dobby.git dobby

      - name: Build Dobby for iPhone
        run: |
          cmake -S dobby -B dobby-build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DDOBBY_GENERATE_SHARED=OFF

          cmake --build dobby-build --config Release

          find dobby-build -name "libdobby.a"

      - name: Compile CMSCrystalLogger v4
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -install_name @rpath/CMSCrystalLogger.dylib \
            CMSCrystalLogger.m \
            -o CMSCrystalLogger.dylib

      - name: Verify output
        run: |
          file CMSCrystalLogger.dylib
          xcrun dwarfdump --uuid CMSCrystalLogger.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: CMSCrystalLogger
          path: CMSCrystalLogger.dylib
