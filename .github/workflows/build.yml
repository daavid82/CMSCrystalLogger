
      - name: Build CMSCrystalBridge
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -O2 \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -install_name @rpath/CMSCrystalBridge.dylib \
            -o CMSCrystalBridge.dylib \
            CMSCrystalBridge.m
