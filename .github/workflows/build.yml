
name: Build CMSCrystalLogger and Bridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source files
        run: |
          ls -la
          test -f CMSCrystalLogger.m
          test -f CMSCrystalBridge.m

      - name: Build CMSCrystalLogger
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -O2 \
            -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework Vision \
            -install_name @rpath/CMSCrystalLogger.dylib \
            -o CMSCrystalLogger.dylib \
            CMSCrystalLogger.m

      - name: Build CMSCrystalBridge
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -O2 \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -install_name @rpath/CMSCrystalBridge.dylib \
            -o CMSCrystalBridge.dylib \
            CMSCrystalBridge.m

      - name: Upload CMSCrystalLogger
        uses: actions/upload-artifact@v4
        with:
          name: CMSCrystalLogger
          path: CMSCrystalLogger.dylib
          if-no-files-found: error

      - name: Upload CMSCrystalBridge
        uses: actions/upload-artifact@v4
        with:
          name: CMSCrystalBridge
          path: CMSCrystalBridge.dylib
          if-no-files-found: error
